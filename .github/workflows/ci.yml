name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Majors, not the minimum that clears the warning. The three actions ran
      # on the Node 20 runtime, which GitHub deprecated and was already forcing
      # onto Node 24 — a forced runtime is a warning today and a broken run on
      # whatever day they stop forcing it. checkout v5, setup-node v5 and
      # setup-python v6 are the first releases that declare node24; these are
      # the current majors on top of that.
      #
      # Their breaking changes were checked against this workflow rather than
      # assumed harmless: setup-node v5 caches automatically when package.json
      # names a packageManager, and app/package.json deliberately does not name
      # one, so there is still nothing for it to detect; setup-python v7 drops
      # the pip-install input, unused here; checkout v7 refuses fork checkouts
      # for pull_request_target and workflow_run, and this workflow triggers on
      # neither.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          # The suites reach for assert, fs and path and nothing else, so this
          # pin is about running on a version that still gets security fixes,
          # not about a feature. Node 20 went end-of-life in April 2026.
          node-version: "24"
      # pytest and an HTTP client for fastapi's TestClient are TEST
      # dependencies, and their absence did not fail the run — it made two
      # modules unimportable, which unittest reports as two errors among
      # hundreds of dots. test_system_restart and test_ui_field_contract have
      # therefore never executed here.
      - run: python -m pip install --upgrade pip fastapi uvicorn pytest httpx
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      # The one defect class neither the suites nor `node --check` can see: a
      # name that is READ but never bound. That is legal JavaScript which
      # throws the first time the line runs, so it ships whenever the line
      # sits in a branch that only executes with real data — `renderDeck`
      # called `deckRowInner(s, now)` with no `now` in scope, the Setup Deck
      # dropped every row under its own heading, and the whole JS suite stayed
      # green. Checked against the revision that shipped it (4cd5965): this
      # step exits 1 with `'now' is not defined`.
      #
      # It is the repo's first npm dependency, and the only one — eslint plus
      # its own core-rules package, no plugins, no shared configs. `npm ci`
      # rather than `npm install`: it installs exactly what app/package-lock
      # .json pins and fails if the two disagree, so CI cannot drift onto a
      # version nobody chose.
      #
      # Warnings do not fail this step, by design; eslint.config.mjs names
      # every rule that is reporting-only and every instance still outstanding
      # under it. Errors do fail it.
      - name: Lint
        if: always()
        run: |
          npm ci
          npx eslint .

      # The JavaScript suites were not run here at all, while HARDENING.md
      # said they were. ticket-math.js decides how big a trade is and
      # re-implements venues.liquidation_price — it is the only thing proving
      # the ticket and the engine agree about where a position dies, and it
      # was landing on main unverified. They need no dependencies: assert,
      # fs and path are built in.
      #
      # Globbed rather than listed. The listed form is how this drifted: the
      # names were written when there were two suites, and the seventeen
      # added since were never added here.
      - name: JavaScript suites
        # always(): these do not depend on the Python suite, and gating them on
        # it means one red step hides the other's status entirely. That is not
        # hypothetical — the Python suite is currently failing on Linux, so the
        # run that first added this step reported nothing at all about the
        # JavaScript side. The job still fails if either fails.
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/test_*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no JavaScript suites found — the glob or the layout changed"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "--- $f"
            node "$f" || exit 1
          done
