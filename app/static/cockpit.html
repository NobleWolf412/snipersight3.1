<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SniperSight — Cockpit</title>
<style>
:root{--bg:#05080b;--panel:#0a0f14;--line:#1c2733;--line-hi:#28394a;--cyan:#2fd6e8;--amber:#ffb547;--red:#ff5d5d;--txt:#c7d3dd;--dim:#6b7c8c;--mono:'Cascadia Code','JetBrains Mono','Consolas',monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:38px 1fr;background:var(--line);gap:1px}
.bar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);font:10px var(--mono);letter-spacing:.12em}
.brand{font-size:12px;color:#e8f4f8}.brand b{color:var(--cyan)}
.sep{width:1px;height:18px;background:var(--line-hi)}
.status{color:var(--dim)}
.actions{margin-left:auto;display:flex;align-items:center;gap:6px}
button,a{font:10px var(--mono);letter-spacing:.1em;color:var(--txt);background:#10171f;border:1px solid var(--line-hi);border-radius:3px;padding:5px 9px;cursor:pointer;text-decoration:none}
button:hover,a:hover,button[aria-expanded="true"]{border-color:var(--cyan);color:var(--cyan)}
button.alert{border-color:#713839;color:#ffd4d4;background:rgba(74,20,24,.35)}
.badge{display:none;min-width:17px;height:17px;padding:0 4px;align-items:center;justify-content:center;border-radius:9px;background:var(--red);color:#fff;font-size:9px;margin-left:5px}.badge.show{display:inline-flex}
.stage{position:relative;min-height:0;background:var(--bg)}
#cockpit{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:4}
.drawer{position:absolute;z-index:5;top:0;right:0;height:100%;width:min(720px,55vw);min-width:420px;background:var(--panel);border-left:1px solid var(--cyan);box-shadow:-12px 0 36px rgba(0,0,0,.5);transform:translateX(101%);transition:transform .18s ease;display:grid;grid-template-rows:36px 1fr}
.drawer.open{transform:translateX(0)}.scrim.open{opacity:1;pointer-events:auto}
.drawer-head{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.12em;color:var(--cyan)}
.drawer-head span{margin-left:auto;color:var(--dim);letter-spacing:.04em}
.drawer-head button{margin-left:8px;padding:3px 7px}
#diagnostics{width:100%;height:100%;border:0;background:var(--bg)}
@media(max-width:800px){.drawer{width:100%;min-width:0}.status,.sep{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand">SNIPER<b>SIGHT</b></div><div class="sep"></div>
    <div class="status" id="status">DECISION PROVENANCE READY</div>
    <div class="actions">
      <a href="/raw" target="_top">RAW COCKPIT</a>
      <button id="diagButton" type="button" aria-controls="diagDrawer" aria-expanded="false"
        title="Why the engine did what it did: setup traces, rejection reasons, data health (Ctrl+Shift+D)">DIAGNOSTICS<span class="badge" id="diagBadge"></span></button>
    </div>
  </header>
  <main class="stage">
    <iframe id="cockpit" src="/raw" title="SniperSight trading cockpit"></iframe>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="diagDrawer" aria-label="Decision diagnostics">
      <div class="drawer-head">DIAGNOSTICS · WHY THIS TRADE, WHY NOT THAT ONE <span>Esc closes · Ctrl+Shift+D toggles</span><button id="diagClose" type="button" aria-label="Close diagnostics">✕</button></div>
      <iframe id="diagnostics" src="/static/diagnostics.html?embed=1&amp;v=2" title="Decision provenance and diagnostics"></iframe>
    </aside>
  </main>
</div>
<script src="/static/cockpit.js?v=2"></script>
</body>
</html>
